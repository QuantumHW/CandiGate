[project]
name = "candigate"
version = "0.1.0"
description = "Candidate-logit training, inference, calibration, and Agent evaluation toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.10,<2",
  "modelscope>=1.31,<2",
  "numpy>=2,<3",
  "peft>=0.17,<1",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "torch>=2.7,<3",
  "transformers>=4.55,<6",
]

[project.scripts]
candigate-make-demo-data = "jev_like.data:main"
candigate-prepare-massive = "jev_like.massive:main"
candigate-make-agent-data = "jev_like.agent_data:main"
candigate-make-agent-data-v2 = "jev_like.agent_data_v2:main"
candigate-check-tokens = "jev_like.tokens:main"
candigate-calibrate = "jev_like.calibrate:main"
candigate-evaluate = "jev_like.evaluate:main"
candigate-predict = "jev_like.predict:main"
candigate-agent-bench = "jev_like.agent_bench:main"
candigate-prepare-bfcl = "jev_like.bfcl:main"
candigate-analyze-bfcl = "jev_like.analyze_bfcl:main"
candigate-train = "jev_like.train:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.hatch.build.targets.wheel]
packages = ["src/jev_like"]
